name: Corrección temporal de dependencias en auditoría

on:
  push:
    branches:
      - audit/fase-1-seguridad-estabilidad
    paths:
      - .github/workflows/dependency-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar desde lockfile
        run: bun install --frozen-lockfile
      - name: Actualizar solo dependencias vulnerables
        run: bun audit fix
        continue-on-error: true
      - name: Exigir ausencia de vulnerabilidades altas en producción
        run: bun audit --prod --audit-level=high
      - name: Validar cambios antes de subirlos
        run: |
          bunx tsc --noEmit
          bun run lint
          bun run test
          bun run build
      - name: Confirmar actualización exclusivamente en la rama de auditoría
        env:
          TARGET_BRANCH: audit/fase-1-seguridad-estabilidad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json bun.lock
          if git diff --cached --quiet; then
            echo "No hubo actualizaciones reproducibles."
            exit 1
          fi
          git commit -m "security: actualizar dependencias afectadas en rama de auditoría"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
